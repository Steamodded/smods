[manifest]
version = "1.0.0"
dump_lua = true
priority = -10

# Change CardArea's background colour
# CardArea.draw
[[patches]]
[patches.pattern]
target = "cardarea.lua"
pattern = "{n=G.UIT.R, config={minw = self.T.w,minh = self.T.h,align = \"cm\", padding = 0.1, mid = true, r = 0.1, colour = self ~= G.shop_vouchers and {0,0,0,0.1} or nil, ref_table = self}, nodes={"
position = 'at'
match_indent = true
payload = '''
{n=G.UIT.R, config={minw = self.T.w,minh = self.T.h,align = "cm", padding = 0.1, mid = true, r = 0.1, colour = self.config.bg_colour or self ~= G.shop_vouchers and {0,0,0,0.1} or nil, ref_table = self}, nodes={
'''

# Remove CardArea count
# CardArea.draw
[[patches]]
[patches.pattern]
target = "cardarea.lua"
pattern = '''
local card_count = self ~= G.shop_vouchers and {n=G.UIT.R, config={align = self == G.jokers and 'cl' or self == G.hand and 'cm' or 'cr', padding = 0.03, no_fill = true}, nodes={
'''
position = 'at'
match_indent = true
payload = '''
local card_count = not self.config.no_card_count and self ~= G.shop_vouchers and {n=G.UIT.R, config={align = self == G.jokers and 'cl' or self == G.hand and 'cm' or 'cr', padding = 0.03, no_fill = true}, nodes={
'''

[[patches]]
[patches.pattern]
target = "cardarea.lua"
pattern = "if not card.states.drag.is then"
position = "at"
payload = "if not card.states.drag.is and not card.disable_align then"
match_indent = true

# Do not call remove_from_highlighted on an unhighlighted card
[[patches]]
[patches.pattern]
target = 'cardarea.lua'
match_indent = true
position = 'at'
pattern = '''
self:remove_from_highlighted(card, true)
'''
payload = '''
if card.highlighted then
    self:remove_from_highlighted(card, true)
end
'''

# Redirect old cardarea buffers to new ones
[[patches]]
[patches.pattern]
target = 'game.lua'
match_indent = true
position = 'after'
pattern = '''
self.GAME = saveTable and saveTable.GAME or self:init_game_object()
'''
payload = '''
-- Redirect cardarea buffers to config buffers
self.GAME.consumeable_buffer = nil
self.GAME.joker_buffer = nil
self.GAME = setmetatable(self.GAME, {
    __index = function(t, key)
        if key == "joker_buffer" then
            return G.jokers and G.jokers.config.buffer or 0
        elseif key == "consumeable_buffer" then
            return G.consumeables and G.consumeables.config.buffer or 0
        end
        return rawget(t, key)
    end,
    __newindex = function(t, key, value)
        if key == "joker_buffer" then
            if G.jokers then
                rawset(G.jokers.config, "buffer", value)
            end
            return
        elseif key == "consumeable_buffer" then
            if G.consumeables then
                rawset(G.consumeables.config, "buffer", value)
            end
            return
        end
        rawset(t, key, value)
    end
})
'''